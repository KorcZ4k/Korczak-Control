name: Build Korczak Control Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/KorczakControl/desktop/**'
      - 'android/KorczakControl/build.gradle.kts'
      - 'android/KorczakControl/settings.gradle.kts'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            task: :desktop:packageMsi
            artifact: Korczak-Control-Windows
            path: android/KorczakControl/desktop/build/compose/binaries/main/msi/*.msi
          - name: macOS
            os: macos-latest
            task: :desktop:packageDmg
            artifact: Korczak-Control-macOS
            path: android/KorczakControl/desktop/build/compose/binaries/main/dmg/*.dmg
          - name: Linux
            os: ubuntu-latest
            task: :desktop:packageDeb
            artifact: Korczak-Control-Linux
            path: android/KorczakControl/desktop/build/compose/binaries/main/deb/*.deb

    defaults:
      run:
        working-directory: android/KorczakControl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native desktop package
        run: gradle ${{ matrix.task }} --stacktrace --no-daemon

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
