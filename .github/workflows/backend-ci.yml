name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/KorczakControlAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/KorczakControlAPI/package.json
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
