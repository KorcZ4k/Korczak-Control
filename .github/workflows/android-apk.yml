name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Korczak Control APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/KorczakControl

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.3.${{ github.run_number }}
      CONTROL_API_URL: ${{ vars.CONTROL_API_URL }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore release keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        working-directory: .
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > android/KorczakControl/app/korczak-release.jks

      - name: Build signed release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_FILE: app/korczak-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME -PCONTROL_API_URL="$CONTROL_API_URL" --stacktrace

      - name: Build debug APK fallback
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: gradle :app:assembleDebug -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME -PCONTROL_API_URL="$CONTROL_API_URL" --stacktrace

      - name: Upload signed release artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Korczak-Control-${{ env.VERSION_NAME }}
          path: android/KorczakControl/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug artifact
        if: ${{ env.HAS_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Korczak-Control-debug-${{ env.VERSION_NAME }}
          path: android/KorczakControl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: ${{ env.HAS_SIGNING == 'true' && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Korczak Control ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: android/KorczakControl/app/build/outputs/apk/release/app-release.apk
