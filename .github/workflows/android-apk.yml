name: Build and publish Android update

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Korczak Control update
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android/KorczakControl

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.3.${{ github.run_number }}
      CONTROL_API_URL: https://korczak-control.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release signing
        working-directory: .
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "ANDROID_KEYSTORE_BASE64 não configurado."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD não configurado."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD não configurado."; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore and inspect release keystore
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/KorczakControl/app/korczak-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "Falha ao restaurar o keystore."; exit 1; }

          echo "Entradas encontradas no keystore:"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD"

          ALIASES=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}')
          COUNT=$(printf '%s\n' "$ALIASES" | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "Nenhuma chave privada foi encontrada no keystore."
            exit 1
          fi

          if [ "$COUNT" -ne 1 ]; then
            echo "Foram encontradas $COUNT chaves privadas. Configure o keystore para ter uma única chave ou ajuste o workflow manualmente."
            exit 1
          fi

          ANDROID_KEY_ALIAS=$(printf '%s\n' "$ALIASES" | head -n 1)
          echo "Usando automaticamente o alias: $ANDROID_KEY_ALIAS"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME -PCONTROL_API_URL="$CONTROL_API_URL" --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Korczak Control ${{ env.VERSION_NAME }}
          generate_release_notes: true
          make_latest: true
          files: android/KorczakControl/app/build/outputs/apk/release/app-release.apk
